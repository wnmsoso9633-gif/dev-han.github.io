<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="물결 위로 물고기가 지나가는 꼬리말">

<style>
  text{font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif}
  .swimR{animation:swimR linear infinite}
  .swimL{animation:swimL linear infinite}
  @keyframes swimR{from{transform:translateX(-160px)}to{transform:translateX(1360px)}}
  @keyframes swimL{from{transform:translateX(1360px)}to{transform:translateX(-160px)}}
  .bob{animation:bob 3.2s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
  .tail{transform-box:fill-box;transform-origin:100% 50%;animation:tail .45s ease-in-out infinite alternate}
  @keyframes tail{from{transform:skewY(-14deg)}to{transform:skewY(14deg)}}
  .weed{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
  .bubble{animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-320px);opacity:0}}
  .ray{animation:ray 7s ease-in-out infinite alternate}
  @keyframes ray{from{opacity:.35}to{opacity:1}}
  .jelly{animation:jelly 6s ease-in-out infinite}
  @keyframes jelly{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
  .pulse{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.08)}}
  .tent{transform-box:fill-box;transform-origin:50% 0;animation:tent 2s ease-in-out infinite alternate}
  @keyframes tent{from{transform:skewX(-8deg)}to{transform:skewX(8deg)}}
  .wave{animation:wave 9s linear infinite}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-600px)}}
  .fade{animation:fade 1.2s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f7290"/><stop offset=".55" stop-color="#08415c"/><stop offset="1" stop-color="#042236"/></linearGradient>
<linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aaf0ff" stop-opacity=".2"/><stop offset="1" stop-color="#aaf0ff" stop-opacity="0"/></linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a27a"/><stop offset="1" stop-color="#6d5b40"/></linearGradient>
<radialGradient id="jg" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#9fb3ff" stop-opacity=".35"/><stop offset="1" stop-color="#9fb3ff" stop-opacity=".05"/></radialGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#021422" flood-opacity=".75"/></filter></defs>
