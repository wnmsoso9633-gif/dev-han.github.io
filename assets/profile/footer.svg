<ellipse cx="-3" rx="5.4" ry="12" fill="#151010"/><ellipse cx="-3" rx="4.2" ry="12" fill="#fff"/>
<ellipse cx="-14" rx="3" ry="12" fill="#151010"/><ellipse cx="-14" rx="2" ry="12" fill="#fff"/>
<ellipse cx="2" cy="-5" rx="14" ry="4" fill="#fff" opacity=".18"/></g>
