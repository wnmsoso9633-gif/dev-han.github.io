<circle cx="10" cy="-4" r="2.4" fill="#f4efd9"/><circle cx="10.36" cy="-4" r="1.488" fill="#0b0b0b"/><circle cx="9.52" cy="-4.72" r="0.528" fill="#fff"/></g></g></g>
<g class="wave" style="animation-duration:11s"><path d="M0 78 Q150 68 300 78 Q450 88 600 78 Q750 68 900 78 Q1050 88 1200 78 Q1350 68 1500 78 Q1650 88 1800 78 Q1950 68 2100 78 Q2250 88 2400 78 V130 H0 Z" fill="#23b5c7" opacity="0.35"/></g><g class="wave" style="animation-duration:8s"><path d="M0 92 Q150 84 300 92 Q450 100 600 92 Q750 84 900 92 Q1050 100 1200 92 Q1350 84 1500 92 Q1650 100 1800 92 Q1950 84 2100 92 Q2250 100 2400 92 V130 H0 Z" fill="#0f7290" opacity="0.7"/></g><g class="wave" style="animation-duration:6s"><path d="M0 106 Q150 100 300 106 Q450 112 600 106 Q750 100 900 106 Q1050 112 1200 106 Q1350 100 1500 106 Q1650 112 1800 106 Q1950 100 2100 106 Q2250 112 2400 106 V130 H0 Z" fill="#08415c" opacity="1"/></g>
<text x="600" y="124" text-anchor="middle" font-size="14" fill="#a9cbd8">방문해 주셔서 감사합니다 · 포트폴리오에서 F 키를 누르면 물고기에게 먹이를 줄 수 있어요</text>
