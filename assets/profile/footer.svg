<rect x="-7" y="0" width="6" height="2.4" fill="#ff3d55"/>
<circle cx="5.4" cy="-.6" r=".9" fill="#111"/></g></g></g><g class="swimL" style="animation-duration:26s;animation-delay:-14s" opacity="1"><g class="bob" style="animation-delay:-4.7s"><g transform="translate(0,70) scale(-0.8,0.8)"><path class="tail" d="M-14 0 L-25 -9 Q-22 0 -25 9 Z" fill="#ffd21f"/>
